{%include 'header.html'%}

<div class="container centered-form">
    <div class="row justify-content-center">
        <div class="col-md-4 ">
            <form class="form-control" action="acceso-login" method="post">
                
                {% if mensaje %}
                    {{mensaje}}
                    {% endif %}
                  
                <div class="form-group">
                    <label for="exampleInputEmail1">Email</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                        placeholder="Ingresar email" name="txtCorreo">
                    
                </div>
                <div class="form-group">
                    <label for="exampleInputPassword1">Contraseña</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Contraseña" name="txtPassword">
                </div>
                
                <button type="submit" class="btn btn-primary "style="margin-top: 10px">Iniciar sesión</button>
               
                    
            
            </form>
        </div>
    </div>
</div>
{%include 'footer.html'%}
